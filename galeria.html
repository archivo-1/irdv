<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Dinámica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: system-ui, sans-serif; background-color: #0d0d0d; color: #e0e0e0; overflow: hidden; }
    .gallery-container { display: flex; width: 100%; height: 100%; }
    
    /* Sidebar */
    .sidebar { width: 140px; background-color: #1e1e1e; border-right: 1px solid #2d2d2d; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .thumb-item { width: 100%; height: 85px; object-fit: cover; border-radius: 4px; cursor: pointer; opacity: 0.6; transition: opacity 0.2s, border 0.2s; border: 2px solid transparent; background: #000; }
    .thumb-item:hover { opacity: 0.9; }
    .thumb-item.active { opacity: 1; border-color: var(--accent-color, #00E5FF); }
    
    /* Visor */
    .viewer { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 20px; }
    .media-wrapper { max-width: 100%; max-height: calc(100% - 40px); display: flex; justify-content: center; align-items: center; }
    .media-wrapper img, .media-wrapper video { max-width: 100%; max-height: 80vh; object-fit: contain; }
    
    /* Botones de navegación */
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; font-size: 2rem; padding: 10px 15px; cursor: pointer; border-radius: 4px; z-index: 10; }
    #prevBtn { left: 15px; }
    #nextBtn { right: 15px; }
    .counter { position: absolute; bottom: 15px; font-size: 0.9rem; color: #888; }
  </style>
</head>
<body>

  <div class="gallery-container">
    <aside class="sidebar" id="thumbnailList"></aside>
    <main class="viewer">
      <button id="prevBtn" class="nav-btn">&#10094;</button>
      <div class="media-wrapper" id="mediaWrapper"></div>
      <button id="nextBtn" class="nav-btn">&#10095;</button>
      <div class="counter" id="imageCounter"></div>
    </main>
  </div>

  <script>
    // Leer parámetros URL
const urlParams = new URLSearchParams(window.location.search);
const folder = urlParams.get('folder') || 'galeria_a';
const total = parseInt(urlParams.get('total')) || 0;
const filesParam = urlParams.get('files');

let images = [];

if (filesParam) {
  images = filesParam.split(',').map(f => `${folder}/${f.trim()}`);
} else if (total > 0) {
  for (let i = 1; i <= total; i++) {
    images.push(`${folder}/${i}`);
  }
}

let currentIndex = 0;
const mediaWrapper = document.getElementById('mediaWrapper');
const thumbnailList = document.getElementById('thumbnailList');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const imageCounter = document.getElementById('imageCounter');

function isVideo(path) {
  const lower = path.toLowerCase();
  return lower.endsWith('.mp4') || lower.endsWith('.webm') || lower.endsWith('.mov');
}

// Carga asíncrona limpia para el visor principal y thumbnails
function renderMedia(basePath, isThumb, container, callback) {
  if (basePath.includes('.')) {
    if (isVideo(basePath)) {
      const vid = document.createElement('video');
      vid.src = basePath;
      if (isThumb) {
        vid.muted = true;
        vid.preload = 'metadata';
        vid.className = 'thumb-item';
      } else {
        vid.controls = true;
        vid.style.maxHeight = '80vh';
        vid.style.maxWidth = '100%';
      }
      container.appendChild(vid);
    } else {
      const img = document.createElement('img');
      img.src = basePath;
      if (isThumb) img.className = 'thumb-item';
      container.appendChild(img);
    }
    if (callback) callback();
    return;
  }

  // Intenta imagen JPG / jpg primero, de lo contrario commuta a video MP4
  const img = document.createElement('img');
  img.src = `${basePath}.JPG`;
  if (isThumb) img.className = 'thumb-item';

  img.onload = () => {
    container.appendChild(img);
    if (callback) callback();
  };

  img.onerror = () => {
    const imgMin = document.createElement('img');
    imgMin.src = `${basePath}.jpg`;
    if (isThumb) imgMin.className = 'thumb-item';

    imgMin.onload = () => {
      container.appendChild(imgMin);
      if (callback) callback();
    };

    imgMin.onerror = () => {
      // Si no es imagen, es un video MP4
      const vid = document.createElement('video');
      vid.src = `${basePath}.mp4`;
      if (isThumb) {
        vid.muted = true;
        vid.preload = 'metadata';
        vid.className = 'thumb-item';
      } else {
        vid.controls = true;
        vid.autoplay = false;
        vid.muted = false;
        vid.style.maxHeight = '80vh';
        vid.style.maxWidth = '100%';
      }
      container.appendChild(vid);
      if (callback) callback();
    };
  };
}

function updateGallery() {
  const currentPath = images[currentIndex];
  mediaWrapper.innerHTML = '';

  renderMedia(currentPath, false, mediaWrapper, () => {
    imageCounter.textContent = `${currentIndex + 1} / ${images.length}`;
    const thumbs = thumbnailList.querySelectorAll('.thumb-item');
    thumbs.forEach((t, i) => t.classList.toggle('active', i === currentIndex));
  });
}

// Generar Miniaturas
thumbnailList.innerHTML = '';
images.forEach((path, index) => {
  const wrapper = document.createElement('div');
  wrapper.style.display = 'contents';
  
  renderMedia(path, true, wrapper, () => {
    const thumbElement = wrapper.firstElementChild;
    if (thumbElement) {
      if (index === currentIndex) thumbElement.classList.add('active');
      thumbElement.addEventListener('click', () => {
        currentIndex = index;
        updateGallery();
      });
    }
  });
  thumbnailList.appendChild(wrapper);
});

prevBtn.addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateGallery();
});

nextBtn.addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % images.length;
  updateGallery();
});

// Forzar la carga inicial inmediata del primer elemento
if (images.length > 0) {
  updateGallery();
}
  </script>
</body>
</html>
