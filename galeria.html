<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Dinámica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: system-ui, sans-serif; background-color: #0d0d0d; color: #e0e0e0; overflow: hidden; }
    .gallery-container { display: flex; width: 100%; height: 100%; }
    
    /* Sidebar */
    .sidebar { width: 140px; background-color: #1e1e1e; border-right: 1px solid #2d2d2d; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .thumb-item { width: 100%; height: 85px; object-fit: cover; border-radius: 4px; cursor: pointer; opacity: 0.6; transition: opacity 0.2s, border 0.2s; border: 2px solid transparent; background: #000; }
    .thumb-item:hover { opacity: 0.9; }
    .thumb-item.active { opacity: 1; border-color: var(--accent-color, #00E5FF); }
    
    /* Visor */
    .viewer { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 20px; }
    .media-wrapper { max-width: 100%; max-height: calc(100% - 40px); display: flex; justify-content: center; align-items: center; }
    .media-wrapper img, .media-wrapper video { max-width: 100%; max-height: 80vh; object-fit: contain; }
    
    /* Botones de navegación */
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; font-size: 2rem; padding: 10px 15px; cursor: pointer; border-radius: 4px; z-index: 10; }
    #prevBtn { left: 15px; }
    #nextBtn { right: 15px; }
    .counter { position: absolute; bottom: 15px; font-size: 0.9rem; color: #888; }
  </style>
</head>
<body>

  <div class="gallery-container">
    <aside class="sidebar" id="thumbnailList"></aside>
    <main class="viewer">
      <button id="prevBtn" class="nav-btn">&#10094;</button>
      <div class="media-wrapper" id="mediaWrapper"></div>
      <button id="nextBtn" class="nav-btn">&#10095;</button>
      <div class="counter" id="imageCounter"></div>
    </main>
  </div>

  <script>
    // 1. Leer parámetros URL: ?folder=galeria_a&files=1.jpg,2.mp4,3.jpg
    const urlParams = new URLSearchParams(window.location.search);
    const folder = urlParams.get('folder') || 'galeria_a';
    const filesParam = urlParams.get('files');

    let images = [];

    if (filesParam) {
      // Si especificamos la lista de archivos explícitamente en la URL
      images = filesParam.split(',').map(f => `${folder}/${f.trim()}`);
    } else {
      // Si no hay lista explícita, genera una secuencia por defecto de JPGs (ej: 22 fotos)
      const total = parseInt(urlParams.get('total')) || 22;
      for (let i = 1; i <= total; i++) {
        images.push(`${folder}/${i}.jpg`);
      }
    }

    let currentIndex = 0;
    const mediaWrapper = document.getElementById('mediaWrapper');
    const thumbnailList = document.getElementById('thumbnailList');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const imageCounter = document.getElementById('imageCounter');

    function isVideo(path) {
      return path.endsWith('.mp4') || path.endsWith('.webm') || path.endsWith('.mov');
    }

    function updateGallery() {
  const currentSrc = images[currentIndex];
  mediaWrapper.innerHTML = '';

  // Cargar Imagen o Video en el visor principal
  if (isVideo(currentSrc)) {
    const video = document.createElement('video');
    video.src = currentSrc;
    
    // --- CONTROLES DE AUDIO Y REPRODUCCIÓN ---
    video.controls = true;      // Muestra barra de reproducción, volumen y pantalla completa
    video.autoplay = false;     // NO reproduce automáticamente
    video.loop = false;         // Se detiene al terminar
    video.muted = false;        // Audio habilitado por defecto
    video.preload = 'metadata'; // Carga previa eficiente
    
    video.style.maxHeight = '80vh';
    video.style.maxWidth = '100%';
    mediaWrapper.appendChild(video);
  } else {
    const img = document.createElement('img');
    img.src = currentSrc;
    img.alt = `Archivo ${currentIndex + 1}`;
    mediaWrapper.appendChild(img);
  }

  // Actualizar contador
  imageCounter.textContent = `${currentIndex + 1} / ${images.length}`;

  // Actualizar miniaturas activas
  const thumbs = thumbnailList.querySelectorAll('.thumb-item');
  thumbs.forEach((t, i) => t.classList.toggle('active', i === currentIndex));
}

// Generar Miniaturas en la barra lateral
images.forEach((src, index) => {
  let thumb;
  if (isVideo(src)) {
    thumb = document.createElement('video');
    thumb.src = src;
    thumb.muted = true;         // Silenciado en la vista previa lateral
    thumb.preload = 'metadata';
  } else {
    thumb = document.createElement('img');
    thumb.src = src;
  }
  thumb.className = 'thumb-item';
  thumb.addEventListener('click', () => {
    currentIndex = index;
    updateGallery();
  });
  thumbnailList.appendChild(thumb);
});

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateGallery();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateGallery();
    });

    // Iniciar
    if (images.length > 0) updateGallery();
  </script>
</body>
</html>
