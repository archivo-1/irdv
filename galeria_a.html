<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            overflow: hidden;
        }

        .gallery-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Barra lateral de miniaturas */
        .sidebar {
            width: 140px;
            background-color: #1e1e1e;
            border-right: 1px solid #2d2d2d;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background-color: #333;
            border-radius: 3px;
        }

        .thumb-item {
            width: 100%;
            height: 85px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s, border 0.2s;
            border: 2px solid transparent;
        }

        .thumb-item:hover {
            opacity: 0.9;
        }

        .thumb-item.active {
            opacity: 1;
            border-color: #3b82f6;
            transform: scale(1.02);
        }

        /* Visor principal */
        .viewer {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #0d0d0d;
            padding: 20px;
        }

        .image-wrapper {
            max-width: 100%;
            max-height: calc(100% - 40px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* Botones de navegación */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            z-index: 10;
        }

        .nav-btn:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

        #prevBtn { left: 20px; }
        #nextBtn { right: 20px; }

        /* Contador de fotos */
        .counter {
            position: absolute;
            bottom: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        /* Diseño responsivo para pantallas muy pequeñas o iframes estrechos */
        @media (max-width: 600px) {
            .gallery-container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 100px;
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
            }
            .thumb-item {
                width: 85px;
                height: 100%;
                flex-shrink: 0;
            }
            .nav-btn {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <!-- Barra lateral con miniaturas -->
        <aside class="sidebar" id="thumbnailList">
            <!-- Las miniaturas se cargan dinámicamente con JavaScript -->
        </aside>

        <!-- Visor central -->
        <main class="viewer">
            <button id="prevBtn" class="nav-btn" aria-label="Anterior">&#10094;</button>
            <div class="image-wrapper">
                <img id="mainImage" src="" alt="Foto de la galería">
            </div>
            <button id="nextBtn" class="nav-btn" aria-label="Siguiente">&#10095;</button>
            <div class="counter" id="imageCounter">1 / 22</div>
        </main>
    </div>

    <script>
        // Configuración: Cambia la extensión si tus fotos no son .jpg (ej. '.png', '.webp')
        const totalPhotos = 22;
        const folderPath = 'galeria_a/';
        const fileExtension = '.jpg'; 

        let currentIndex = 0;
        const images = [];

        // Generar la ruta de las 22 fotos automáticamente
        for (let i = 1; i <= totalPhotos; i++) {
            images.push(`${folderPath}${i}${fileExtension}`);
        }

        const mainImage = document.getElementById('mainImage');
        const thumbnailList = document.getElementById('thumbnailList');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const imageCounter = document.getElementById('imageCounter');

        // Construir la barra lateral de miniaturas
        images.forEach((src, index) => {
            const thumb = document.createElement('img');
            thumb.src = src;
            thumb.alt = `Miniatura ${index + 1}`;
            thumb.className = 'thumb-item';
            thumb.addEventListener('click', () => {
                currentIndex = index;
                updateGallery();
            });
            thumbnailList.appendChild(thumb);
        });

        const thumbs = thumbnailList.getElementsByClassName('thumb-item');

        function updateGallery() {
            // Actualizar imagen principal
            mainImage.src = images[currentIndex];
            imageCounter.textContent = `${currentIndex + 1} / ${totalPhotos}`;

            // Actualizar clase activa en miniaturas
            for (let i = 0; i < thumbs.length; i++) {
                thumbs[i].classList.remove('active');
            }
            thumbs[currentIndex].classList.add('active');

            // Hacer scroll en la barra lateral para mantener la miniatura visible
            thumbs[currentIndex].scrollIntoView({
                behavior: 'smooth',
                block: 'nearest',
                inline: 'nearest'
            });
        }

        // Funciones de navegación
        function nextImage() {
            currentIndex = (currentIndex + 1) % totalPhotos;
            updateGallery();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + totalPhotos) % totalPhotos;
            updateGallery();
        }

        nextBtn.addEventListener('click', nextImage);
        prevBtn.addEventListener('click', prevImage);

        // Soporte para teclado (flechas izquierda y derecha)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });

        // Inicializar la galería
        updateGallery();
    </script>
</body>
</html>
